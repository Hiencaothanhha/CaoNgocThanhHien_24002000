<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh Mục Sản Phẩm</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
        }
        
        /* CSS cho component thẻ sản phẩm */
        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        
        .out-of-stock {
            opacity: 0.8;
            filter: grayscale(40%);
        }
        
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
        }
        
        .card-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        .product-name {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #333;
            line-height: 1.4; 
            height: 3.36rem; 
            overflow: hidden; 
            display: -webkit-box;
        }
        
        .product-price {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            font-weight: bold;
            color: #e74c3c;
        }
        
        .status {
            margin-bottom: 15px;
        }
        
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .badge-success {
            background: #d4edda;
            color: #155724;
        }
        
        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }
        
        .btn-toggle {
            background: transparent;
            border: 1px solid #3498db;
            color: #3498db;
            padding: 8px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        
        .btn-toggle:hover {
            background: #3498db;
            color: white;
        }
        
        .description {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 5px;
            line-height: 1.5;
        }
        
        .btn-buy {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: auto;
            font-size: 1rem;
            transition: 0.2s;
        }
        
        .btn-buy:hover:not(:disabled) {
            background: #27ae60;
        }
        
        .btn-buy:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="app" class="container">
        <h2>Danh Mục Sản Phẩm</h2>
        
        <!-- Truyền dữ liệu từ cha xuống con -->
        <div class="product-grid">
            <the-san-pham 
                v-for="sp in danhSachSanPhams" 
                :key="sp.id"
                :ten="sp.ten"
                :gia="sp.gia"
                :anh="sp.anh"
                :mo-ta="sp.moTa"
                :so-luong-ton="sp.soLuongTon"
            ></the-san-pham>
        </div>
    </div>

    <script src="components/TheSanPham.js"></script>
    
    <script>
        const app = Vue.createApp({
            // Component data chứa danh sách sản phẩm
            data() {
                return {
                    danhSachSanPhams: [
                        {
                            id: 1,
                            ten: 'Điện thoại iPhone 15',
                            gia: 22000000,
                            anh: 'https://cdnv2.tgdd.vn/mwg-static/common/News/1564409/iphone-15-va-15-plus.jpg',
                            moTa: 'Siêu phẩm Apple 2023 với chip A16 Bionic, thiết kế Dynamic Island hiện đại.',
                            soLuongTon: 15
                        },
                        {
                            id: 2,
                            ten: 'Tai nghe Sony WH-1000XM5',
                            gia: 7500000,
                            anh: 'https://cdn.tgdd.vn/Files/2022/04/23/1427960/1000xm5_1280x998-800-resize.jpg',
                            moTa: 'Tai nghe chống ồn chủ động tốt nhất thế giới, pin 30 giờ.',
                            soLuongTon: 0
                        },
                        {
                            id: 3,
                            ten: 'Chuột Logitech MX Master 3S',
                            gia: 2500000,
                            anh: 'https://product.hstatic.net/200000722513/product/mx-master-3s-mouse-top-view-pale-gray_41dba78b9e384508aa5bc3109f249523_ec963b4f86984fdea690801a3ae8ad35.png',
                            moTa: 'Chuột không dây công thái học, cuộn siêu tốc, nút click chống ồn.',
                            soLuongTon: 8
                        },
                        {
                            id: 4,
                            ten: 'Bàn phím cơ Keychron K2',
                            gia: 1800000,
                            soLuongTon: 3
                        }
                    ]
                }
            }
        });

        // Nạp component TheSanPham
        app.component('the-san-pham', TheSanPham);
        app.mount('#app');
    </script>
</body>
</html>
